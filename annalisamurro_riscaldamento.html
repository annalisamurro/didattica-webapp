<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Passaggi di Stato dell'Acqua e Curva di Riscaldamento</title>
  <style>
    /* ==========================================================================
       1. VARIABILI CSS & RESET (Palette Termodinamica & UI Didattica)
       ========================================================================== */
    :root {
      --bg-app: #f0f4f8;
      --bg-card: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;

      /* Palette Termodinamica */
      --ice-color: #0284c7;       /* Azzurro freddo */
      --ice-bg: #e0f2fe;
      --melt-color: #0ea5e9;      /* Ciano transizione */
      --melt-bg: #f0f9ff;
      --liquid-color: #2563eb;    /* Blu elettrico */
      --liquid-bg: #eff6ff;
      --boil-color: #f97316;      /* Arancione ebollizione */
      --boil-bg: #fff7ed;
      --gas-color: #dc2626;       /* Rosso vapore */
      --gas-bg: #fef2f2;

      /* Accento dinamico (aggiornato via JS) */
      --active-color: #0284c7;
      --active-bg: #e0f2fe;

      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.08);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
      line-height: 1.5;
      padding: 1rem;
    }

    /* ==========================================================================
       2. LAYOUT PRINCIPALE (Header + Griglia Responsive 2 Colonne)
       ========================================================================== */
    .container {
      max-width: 1340px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 1.25rem;
    }

    header h1 {
      font-size: clamp(1.4rem, 2.5vw, 2rem);
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.02em;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 0.2rem;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1.25fr;
      gap: 1.25rem;
      align-items: start;
    }

    @media (max-width: 960px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-color);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.75rem;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .badge {
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      background-color: var(--active-bg);
      color: var(--active-color);
      border: 1px solid currentColor;
      transition: all 0.25s ease;
    }

    /* ==========================================================================
       3. COLONNA SINISTRA: SIMULATORE MICROSCOPICO + TERMOMETRO + CONTROLLI
       ========================================================================== */
    .sim-wrapper {
      display: flex;
      gap: 1rem;
      align-items: stretch;
      justify-content: center;
    }

    .canvas-box {
      position: relative;
      flex: 1;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #cbd5e1;
      background: #0f172a;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.35);
    }

    #particleCanvas {
      display: block;
      width: 100%;
      height: 330px;
    }

    /* Termometro Visivo Animato */
    .thermometer-panel {
      width: 68px;
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 0.6rem 0.35rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      user-select: none;
    }

    .thermo-readout {
      font-weight: 800;
      font-size: 0.9rem;
      color: var(--active-color);
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    .thermo-track-wrapper {
      position: relative;
      flex: 1;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0.4rem 0;
    }

    .thermo-stem {
      position: relative;
      width: 14px;
      height: 195px;
      background: #e2e8f0;
      border-radius: 999px;
      border: 2px solid #94a3b8;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
    }

    .thermo-fill {
      width: 100%;
      height: 15%;
      background: linear-gradient(to top, #0284c7, #38bdf8);
      transition: background 0.3s ease;
    }

    .thermo-bulb {
      position: absolute;
      bottom: 4px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--active-color);
      border: 2px solid #64748b;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      transition: background-color 0.3s ease;
    }

    .thermo-ticks {
      position: absolute;
      right: 2px;
      height: 195px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* Controlli Calore e Riproduzione */
    .controls-box {
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .heat-value {
      font-variant-numeric: tabular-nums;
      color: var(--active-color);
      font-weight: 700;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(
        to right,
        #0284c7 0%,
        #38bdf8 26%,
        #2563eb 52%,
        #f97316 88%,
        #dc2626 100%
      );
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #ffffff;
      border: 3px solid var(--active-color);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      cursor: grab;
      transition: transform 0.15s ease, border-color 0.25s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
