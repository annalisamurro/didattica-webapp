<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Passaggi di Stato dell'Acqua e Curva di Riscaldamento</title>
  <style>
    /* ==========================================================================
       VARIABILI CSS E RESET
       Palette termodinamica: freddo (ghiaccio), medio (acqua), caldo (vapore)
       ========================================================================== */
    :root {
      --bg-app: #f1f5f9;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border-subtle: #e2e8f0;

      /* Colori di fase */
      --ice-primary: #38bdf8;
      --ice-dark: #0284c7;
      --ice-bg: #e0f2fe;

      --water-primary: #2563eb;
      --water-dark: #1d4ed8;
      --water-bg: #dbeafe;

      --steam-primary: #f97316;
      --steam-dark: #ea580c;
      --steam-bg: #ffedd5;

      --hot-primary: #ef4444;
      --hot-bg: #fee2e2;

      /* Colore dinamico corrente (aggiornato via JS) */
      --accent-current: #38bdf8;
      --accent-bg-current: #e0f2fe;

      --radius-lg: 16px;
      --radius-md: 10px;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.08);
      --shadow-md: 0 4px 16px rgba(15, 23, 42, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
      line-height: 1.5;
      padding: 1rem;
      min-height: 100vh;
    }

    /* ==========================================================================
       LAYOUT PRINCIPALE (Header + Griglia Responsive a 2 Colonne)
       ========================================================================== */
    .app-container {
      max-width: 1320px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    header {
      background: var(--bg-card);
      padding: 1.25rem 1.75rem;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-subtle);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    header h1 {
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    header p {
      font-size: 0.92rem;
      color: var(--text-muted);
    }

    .badge-temp {
      font-size: 1.35rem;
      font-weight: 800;
      padding: 0.45rem 1rem;
      border-radius: 999px;
      background-color: var(--accent-bg-current);
      color: var(--accent-current);
      border: 2px solid var(--accent-current);
      font-variant-numeric: tabular-nums;
      transition: all 0.25s ease;
      white-space: nowrap;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      gap: 1.25rem;
      align-items: start;
    }

    @media (max-width: 980px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    .column {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 1.25rem 1.5rem;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-subtle);
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-main);
    }

    /* ==========================================================================
       COLONNA SINISTRA: SIMULAZIONE PARTICELLARE + TERMOMETRO + CONTROLLI
       ========================================================================== */
    .micro-stage {
      display: flex;
      gap: 1rem;
      align-items: stretch;
      height: 310px;
    }

    .particle-wrapper {
      flex: 1;
      position: relative;
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 2px solid #cbd5e1;
      background: linear-gradient(180deg, #f8fafc 0%, #eff6ff 100%);
    }

    #particleCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .burner-indicator {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 8px;
      background: linear-gradient(90deg, #f97316, #ef4444, #f97316);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .burner-indicator.active {
      opacity: 1;
      animation: pulseFlame 1s infinite alternate;
    }

    @keyframes pulseFlame {
      from { filter: brightness(0.95); }
      to { filter: brightness(1.3); }
    }

    /* Termometro Visivo */
    .thermometer-box {
      width: 74px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      background: #f8fafc;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 0.65rem 0.35rem;
      user-select: none;
    }

    .thermo-label-top {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .thermo-tube-area {
      position: relative;
      flex: 1;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0.35rem 0;
    }

    .thermo-tube {
      width: 14px;
      height: 100%;
      background: #e2e8f0;
      border-radius: 999px;
      position: relative;
      overflow: hidden;
      border: 2px solid #94a3b8;
      z-index: 2;
    }

    .thermo-fill {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 20%;
      background: var(--accent-current);
      transition: background-color 0.2s ease;
    }

    .thermo-bulb {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--accent-current);
      border: 2px solid #94a3b8;
      margin-top: -6px;
      z-index: 3;
      transition: background-color 0.2s ease;
    }

    /* Tacche di riferimento 0°C e 100°C sul termometro */
    .thermo-tick {
      position: absolute;
      right: 4px;
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .thermo-tick::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 1.5px;
      background: #64748b;
    }

    /* Pannello Controlli */
    .controls-section {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .heat-value {
      color: var(--water-dark);
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(
        90deg,
        #38bdf8 0%,
        #38bdf8 10%,
        #7dd3fc 26%,
        #2563eb 54%,
        #f97316 90%,
        #ef4444 100%
      );
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #ffffff;
      border: 3px solid var(--text-main);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      cursor: grab;
      transition: transform 0.1s ease;
    }

    input[type="range"]::-webkit-slider-thumb:active {
      transform: scale(1.15);
      cursor: grabbing;
    }

    .playback-buttons {
      display: flex;
      gap: 0.65rem;
      flex-wrap: wrap;
    }

    button {
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 0.55rem 1rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background: #f8fafc;
      color: var(--text-main);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      transition: all 0.15s ease;
    }

    button:hover {
      background: #e2e8f0;
    }

    button.btn-primary {
      background: var(--water-primary);
      color: #ffffff;
      border-color: var(--water-dark);
    }

    button.btn-primary:hover {
      background: var(--water-dark);
    }

    button.btn-warning {
      background: #f59e0b;
      color: #ffffff;
      border-color: #d97706;
    }

    .quick-jumps-label {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 0.45rem;
    }

    .quick-jumps {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(115px, 1fr));
      gap: 0.45rem;
    }

    .btn-phase {
      font-size: 0.78rem;
      padding: 0.45rem 0.5rem;
      text-align: center;
      border-radius: 8px;
      background: #f8fafc;
    }

    .btn-phase.active-phase {
      background: var(--accent-bg-current);
      border-color: var(--accent-current);
      color: var(--text-main);
      font-weight: 700;
      box-shadow: inset 0 0 0 1px var(--accent-current);
    }

    /* ==========================================================================
       COLONNA DESTRA: GRAFICO CURVA DI RISCALDAMENTO + BOX DIDATTICO
       ========================================================================== */
    .chart-wrapper {
      position: relative;
      width: 100%;
      height: 310px;
    }

    #curveCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Box Didattico Contestuale */
    .didactic-box {
      border-left: 6px solid var(--accent-current);
      transition: border-color 0.25s ease;
    }

    .phase-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .phase-pill {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      background: var(--accent-bg-current);
      color: var(--text-main);
    }

    .temp-behavior {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .didactic-text {
      font-size: 0.95rem;
      color: var(--text-main);
      margin-bottom: 0.85rem;
    }

    .latent-callout {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-left: 4px solid #f59e0b;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.88rem;
      color: #78350f;
      display: none; /* Visibile solo durante le soste termiche */
    }

    .latent-callout.visible {
      display: block;
      animation: fadeIn 0.25s ease;
    }

    .sensible-callout {
      background: #f8fafc;
      border: 1px solid var(--border-subtle);
      padding: 0.7rem 1rem;
      border-radius: 8px;
      font-size: 0.86rem;
      color: var(--text-muted);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- INTESTAZIONE -->
    <header>
      <div>
        <h1>🧪 Passaggi di Stato dell'Acqua &amp; Curva di Riscaldamento</h1>
        <p>Esplora come varia la temperatura e come si comportano le molecole d'acqua fornendo calore costante.</p>
      </div>
      <div class="badge-temp" id="headerTempBadge">-20,0 °C</div>
    </header>

    <!-- GRIGLIA PRINCIPALE -->
    <main class="main-grid">

      <!-- COLONNA SINISTRA: Vista Microscopica e Controlli -->
      <section class="column">
        <div class="card">
          <div class="card-title">
            <span>🔬 Vista Microscopica (Molecole H₂O)</span>
            <span id="microStateTag" style="font-size: 0.82rem; color: var(--text-muted);">Reticolo cristallino</span>
          </div>

          <div class="micro-stage">
            <!-- Canvas Particellare -->
            <div class="particle-wrapper">
              <canvas id="particleCanvas"></canvas>
              <div class="burner-indicator" id="burnerBar" title="Fornello acceso: somministrazione di calore"></div>
            </div>

            <!-- Termometro Visivo -->
            <div class="thermometer-box" aria-label="Termometro">
              <span class="thermo-label-top">120°C</span>
              <div class="thermo-tube-area">
                <!-- Tacca 100°C: (100 - (-20)) / 140 = 120 / 140 = 85.7% dal basso -->
                <div class="thermo-tick" style="bottom: 85.7%;">100°</div>
                <!-- Tacca 0°C: (0 - (-20)) / 140 = 20 / 140 = 14.3% dal basso -->
                <div class="thermo-tick" style="bottom: 14.3%;">0°</div>

                <div class="thermo-tube">
                  <div class="thermo-fill" id="thermoFill"></div>
                </div>
              </div>
              <div class="thermo-bulb" id="thermoBulb"></div>
            </div>
          </div>
        </div>

        <!-- Pannello Controlli -->
        <div class="card controls-section">
          <div>
            <div class="slider-header">
              <label for="heatSlider">🔥 Calore fornito / Tempo di riscaldamento</label>
              <span class="heat-value" id="heatReadout">0 kJ (0%)</span>
            </div>
            <input type="range" id="heatSlider" min="0" max="100" step="0.1" value="0" />
          </div>

          <div class="playback-buttons">
            <button type="button" class="btn-primary" id="btnPlayPause">▶ Avvia Riscaldamento</button>
            <button type="button" id="btnReset">↺ Reset (-20°C)</button>
          </div>

          <div>
            <div class="quick-jumps-label">Salta direttamente a una fase:</div>
            <div class="quick-jumps"
