<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Didattica WebApp — Prof.ssa Annalisa Murro (Scienze Naturali)</title>
  <style>
    :root {
      --green-dark: #1b4332;
      --green-main: #2d6a4f;
      --green-light: #52b788;
      --cream: rgba(255, 255, 255, 0.92);
      --glass: rgba(255, 255, 255, 0.85);
      --text-main: #1f2933;
      --text-muted: #4b5563;
      --accent-amber: #d97706;
      --shadow: 0 14px 35px rgba(27, 67, 50, 0.18);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #87ceeb;
      position: relative;
      overflow-x: hidden;
      line-height: 1.6;
    }

    /* Sfondo naturalistico a prato fiorito (SVG integrato, sempre visibile anche offline) */
    .meadow-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #9ad9f5 0%, #d8f3dc 48%, #74c69d 68%, #40916c 100%);
      overflow: hidden;
    }

    .meadow-bg svg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Barra superiore con intestazione in alto a destra */
    header {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 24px 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 16px;
    }

    .portal-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--glass);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 10px 16px;
      border-radius: 999px;
      text-decoration: none;
      color: var(--green-dark);
      font-weight: 600;
      font-size: 0.9rem;
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 6px 18px rgba(27, 67, 50, 0.12);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .portal-link:hover {
      transform: translateY(-2px);
      background: #ffffff;
    }

    .teacher-badge {
      margin-left: auto;
      text-align: right;
      background: var(--cream);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 14px 22px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: var(--shadow);
    }

    .teacher-badge .full-name {
      font-size: 1.12rem;
      font-weight: 800;
      color: var(--green-dark);
      letter-spacing: -0.01em;
    }

    .teacher-badge .short-name {
      display: inline-block;
      margin-top: 4px;
      padding: 2px 10px;
      border-radius: 999px;
      background: #d8f3dc;
      color: var(--green-dark);
      font-size: 0.82rem;
      font-weight: 700;
    }

    /* Contenitore principale */
    main {
      width: 100%;
      max-width: 1200px;
      margin: 12px auto 48px;
      padding: 0 24px;
      flex: 1;
    }

    .hero {
      background: var(--cream);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: var(--radius);
      padding: 32px 36px;
      margin-bottom: 28px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.8);
      text-align: center;
    }

    .hero h1 {
      font-size: clamp(1.8rem, 3.2vw, 2.5rem);
      color: var(--green-dark);
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }

      max
